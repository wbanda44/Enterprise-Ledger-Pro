<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Ledger Pro v2.1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f4f7f6; --card: #ffffff; --text: #333; --border: #ddd;
            --primary: #007bff; --success: #28a745; --danger: #dc3545; --warn: #ffc107;
        }
        [data-theme="dark"] {
            --bg: #1a1a1a; --card: #2d2d2d; --text: #f4f7f6; --border: #444;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .container { max-width: 1100px; margin: auto; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .account-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .account-card { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 8px; min-width: 130px; text-align: center; }
        .input-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        input, select, button { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); }
        button { cursor: pointer; font-weight: 600; border: none; }
        .chart-box { height: 300px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.05); }
        .progress-bar { background: #eee; height: 12px; border-radius: 6px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; transition: 0.5s; }
        @media print {
            body * { visibility: hidden; } #pl-report, #pl-report * { visibility: visible; }
            #pl-report { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Enterprise Ledger Pro <span style="font-size: 0.5em; vertical-align: middle; opacity: 0.7;">v2.1</span></h2>
        <div style="display: flex; gap: 10px;">
            <select id="curr-sel" onchange="updateCurrency()">
                <option value="$">USD ($)</option><option value="£">GBP (£)</option>
                <option value="€">EUR (€)</option><option value="¥">JPY (¥)</option>
            </select>
            <button onclick="toggleDarkMode()" style="background:var(--border)">🌙</button>
        </div>
    </div>

    <div id="goal-container" style="margin-bottom: 25px; padding: 15px; border: 1px solid var(--border); border-radius: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0">Annual Sales Target</h3>
            <button onclick="setRevenueGoal()" style="background:var(--primary); color:white; font-size:0.7em">Update Goal</button>
        </div>
        <div class="progress-bar"><div id="goal-fill" class="progress-fill" style="background:var(--success); width:0%"></div></div>
        <p id="goal-text" style="font-size:0.85em; margin:5px 0 0 0"></p>
    </div>

    <div class="account-grid" id="acc-grid"></div>

    <div class="chart-box"><canvas id="mainChart"></canvas></div>

    <form id="entry-form" class="input-group">
        <input type="date" id="date" required>
        <input type="text" id="desc" placeholder="Transaction Description" required>
        <select id="dr">
            <optgroup label="Assets/Expenses">
                <option value="Cash">Cash</option>
                <option value="Supplies">Supplies</option>
                <option value="Equipment">Equipment</option>
                <option value="Expenses">Expenses</option>
            </optgroup>
        </select>
        <select id="cr">
            <optgroup label="Income/Equity/Liability">
                <option value="Revenue">Revenue</option>
                <option value="Accounts Payable">Accounts Payable</option>
                <option value="Owner Equity">Owner Equity</option>
                <option value="Equipment">Equipment (Deprec.)</option>
            </optgroup>
        </select>
        <input type="number" id="amt" placeholder="Amount" step="0.01" required>
        <input type="text" id="notes" placeholder="Invoice # / Audit Notes">
        <button type="submit" style="background:var(--success); color:white;">Post Entry</button>
    </form>

    <div class="input-group">
        <input type="text" id="search" placeholder="Filter ledger..." onkeyup="refreshUI()">
        <button onclick="generatePL()" style="background: #6f42c1; color:white;">P&L Statement</button>
        <button onclick="toggleBudget()" style="background: var(--warn);">Expense Budgets</button>
        <button onclick="exportCSV()" style="background: #17a2b8; color:white;">Export Data</button>
        <button onclick="clearSystem()" style="background: var(--danger); color:white;">Reset All</button>
    </div>

    <div id="budget-ui" style="display:none; margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.03); border-radius: 8px; border: 1px dashed var(--border);"></div>

    <div id="pl-report" style="display:none; border: 2px solid var(--primary); padding: 25px; margin-top: 20px; border-radius: 8px; background: var(--card);">
        <h3>Profit & Loss Report</h3>
        <p>Period: Fiscal Year 2026 | Tax Rate: <input type="number" id="tax-rate" value="15" style="width:50px" onchange="generatePL()">%</p>
        <div id="pl-content"></div>
        <div class="report-actions" style="margin-top:15px">
            <button class="no-print" onclick="window.print()" style="background:var(--success); color:white">🖨️ Save as PDF</button>
            <button class="no-print" onclick="d('pl-report').style.display='none'">Close</button>
        </div>
    </div>

    <table>
        <thead><tr><th>Date</th><th>Description</th><th>Debit (Dr)</th><th>Credit (Cr)</th><th>Amount</th><th>Notes</th><th>Action</th></tr></thead>
        <tbody id="ledger-body"></tbody>
    </table>
</div>

<script>
    let txs = JSON.parse(localStorage.getItem('txs')) || [];
    let budgets = JSON.parse(localStorage.getItem('budgets')) || { Expenses: 0, Supplies: 0 };
    let curr = localStorage.getItem('curr') || '$';
    let revenueGoal = localStorage.getItem('revenueGoal') || 0;
    let chart = null;

    d('curr-sel').value = curr;
    d('entry-form').onsubmit = (e) => {
        e.preventDefault();
        txs.push({ 
            date: d('date').value, desc: d('desc').value, 
            dr: d('dr').value, cr: d('cr').value, 
            amt: parseFloat(d('amt').value), notes: d('notes').value 
        });
        save(); e.target.reset();
    };

    function d(id) { return document.getElementById(id); }
    function save() { localStorage.setItem('txs', JSON.stringify(txs)); refreshUI(); }
    function format(n) { return curr + n.toLocaleString(undefined, {minimumFractionDigits: 2}); }

    function refreshUI() {
        const search = d('search').value.toLowerCase();
        const body = d('ledger-body'); body.innerHTML = '';
        const accs = {};
        
        txs.forEach((t, i) => {
            if (!accs[t.dr]) accs[t.dr] = 0; if (!accs[t.cr]) accs[t.cr] = 0;
            accs[t.dr] += t.amt; accs[t.cr] -= t.amt;
            if (t.desc.toLowerCase().includes(search) || t.dr.toLowerCase().includes(search) || t.cr.toLowerCase().includes(search) || (t.notes && t.notes.toLowerCase().includes(search))) {
                body.innerHTML += `<tr><td>${t.date}</td><td>${t.desc}</td><td style="color:var(--success)">${t.dr}</td><td style="color:var(--danger)">${t.cr}</td><td>${format(t.amt)}</td><td style="color:#666; font-size:0.85em; font-style:italic;">${t.notes||'-'}</td><td><button onclick="del(${i})" style="color:var(--danger)">Void</button></td></tr>`;
            }
        });

        d('acc-grid').innerHTML = Object.keys(accs).map(a => `<div class="account-card"><strong>${a}</strong><br><span style="color:${accs[a]>=0?'var(--success)':'var(--danger)'}">${format(Math.abs(accs[a]))}</span></div>`).join('');
        
        updateChart();
        updateBudgetUI();
        updateGoalProgress();
    }

    function updateChart() {
        const months = {};
        txs.forEach(t => {
            const m = t.date.substring(0,7); if (!months[m]) months[m] = {r:0, e:0};
            if (t.cr === 'Revenue') months[m].r += t.amt; if (t.dr === 'Expenses') months[m].e += t.amt;
        });
        const labels = Object.keys(months).sort();
        if (chart) chart.destroy();
        chart = new Chart(d('mainChart'), {
            type: 'bar',
            data: { labels, datasets: [{label:'Revenue', data:labels.map(l=>months[l].r), backgroundColor:'rgba(40,167,69,0.5)'},{label:'Expenses', data:labels.map(l=>months[l].e), backgroundColor:'rgba(220,53,69,0.5)'}] },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } }
        });
    }

    function generatePL() {
        let r=0, e=0; txs.forEach(t => { if(t.cr==='Revenue') r+=t.amt; if(t.dr==='Expenses') e+=t.amt; });
        const net = r-e, tax = net>0?net*(d('tax-rate').value/100):0;
        d('pl-date').innerText = new Date().toLocaleDateString();
        d('pl-content').innerHTML = `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
                <div><p>Gross Revenue:</p><h3>${format(r)}</h3></div>
                <div><p>Operating Expenses:</p><h3>${format(e)}</h3></div>
            </div>
            <hr>
            <div style="text-align:right">
                <p>Pre-Tax Net Income: <b>${format(net)}</b></p>
                <p style="color:var(--danger)">Est. Tax Liability: -${format(tax)}</p>
                <h2 style="color:var(--success)">Total Disposable Profit: ${format(net-tax)}</h2>
            </div>`;
        d('pl-report').style.display = 'block';
    }

    function setRevenueGoal() {
        const val = prompt("Enter your Annual Revenue Goal:", revenueGoal);
        if (val !== null) { revenueGoal = parseFloat(val) || 0; localStorage.setItem('revenueGoal', revenueGoal); refreshUI(); }
    }

    function updateGoalProgress() {
        const curY = new Date().getFullYear().toString();
        const total = txs.reduce((sum, t) => (t.date.startsWith(curY) && t.cr==='Revenue') ? sum+t.amt : sum, 0);
        const pc = revenueGoal > 0 ? Math.min((total/revenueGoal)*100, 100) : 0;
        d('goal-fill').style.width = pc + "%";
        d('goal-text').innerHTML = `<b>${format(total)}</b> earned toward <b>${format(revenueGoal)}</b> annual goal (${pc.toFixed(1)}%)`;
    }

    function toggleBudget() {
        const ui = d('budget-ui'); ui.style.display = ui.style.display==='none'?'block':'none';
        ui.innerHTML = `<h4>Manage Monthly Limits</h4>
            <div style="display:flex; gap:15px; align-items:center;">
                Expenses: <input id="b-exp" type="number" value="${budgets.Expenses}"> 
                Supplies: <input id="b-sup" type="number" value="${budgets.Supplies}"> 
                <button onclick="saveB()" style="background:var(--success); color:white">Update Budgets</button>
            </div>`;
    }

    function saveB() { 
        budgets = { Expenses: parseFloat(d('b-exp').value)||0, Supplies: parseFloat(d('b-sup').value)||0 }; 
        localStorage.setItem('budgets', JSON.stringify(budgets)); refreshUI(); 
    }

    function updateBudgetUI() {
        // Budget bars can be visually implemented here or inside the account-grid logic.
    }

    function clearSystem() {
        if(confirm("WIPE ALL DATA? This will reset your entire ledger.") && confirm("Are you sure? This cannot be undone.")) {
            localStorage.clear(); location.reload();
        }
    }

    function del(i) { if(confirm("Void this transaction?")) { txs.splice(i,1); save(); } }
    function toggleDarkMode() { const t = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
    function updateCurrency() { curr = d('curr-sel').value; localStorage.setItem('curr', curr); refreshUI(); }
    function exportCSV() { const csv = "Date,Description,Debit,Credit,Amount,Notes\n" + txs.map(t => `${t.date},${t.desc},${t.dr},${t.cr},${t.amt},"${t.notes||''}"`).join("\n"); const blob = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='business_ledger_export.csv'; a.click(); }

    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    refreshUI();
</script>
</body>

</html>
